targets:
  $default:
    builders:
      obmin_flutter|composable:
        enabled: true

builders:
  composable:
    target: ":obmin-flutter"
    import: "package:obmin_flutter/generators/builder.dart"
    builder_factories: ["composableGeneratorFactory"]
    build_extensions: {".dart": [".composable.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]